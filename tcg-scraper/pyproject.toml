[project]
name = "tcg-scraper"
version = "0.1.0"
description = "Trading card catalog sync (apitcg.com) and photo identification (local Ollama vision model)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "pillow>=11.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
tcg-scraper = "tcg_scraper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcg_scraper"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
]
