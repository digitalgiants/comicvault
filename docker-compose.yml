networks:
  comicvault:
    driver: bridge

services:
  frontend:
    build:
      context: ./vault/frontend
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    restart: unless-stopped
    networks:
      - comicvault
    volumes:
      - ./vault/frontend/src:/app/src:z
    environment:
      - VITE_API_URL=/api
      - VITE_PROXY_TARGET=http://backend:8000
      - VITE_ALLOWED_HOST=cv.digitalgiants.net
    depends_on:
      - backend

  backend:
    build:
      context: ./vault/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - comicvault
    volumes:
      - ./vault/backend:/app:z
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=postgresql://comicvault:comicvault@postgres:5432/comicvault
      - JWT_SECRET=${JWT_SECRET:-supersecretchangeme}
      - KIOSK_PASSWORD=${KIOSK_PASSWORD:-kiosk}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=10080
      - WATCHFILES_FORCE_POLLING=true
      - CORS_ORIGINS=https://cv.digitalgiants.net,http://localhost:3002
      - COMIC_SCRAPER_URL=http://comic-scraper:9095
      - TCG_SCRAPER_URL=http://tcg-scraper:9096
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "until pg_isready -h postgres -U comicvault; do sleep 1; done
      && python migrate.py
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  comic-scraper:
    build:
      context: ./comic-scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - comicvault
    environment:
      - METRON_USERNAME=${METRON_USERNAME}
      - METRON_PASSWORD=${METRON_PASSWORD}
      - POSTGRES_USER=comicvault
      - POSTGRES_PASSWORD=comicvault
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=comic_scraper
    depends_on:
      postgres:
        condition: service_healthy

  tcg-scraper:
    build:
      context: ./tcg-scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - comicvault
    environment:
      - APITCG_API_KEY=${APITCG_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-moondream}
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks:
      - comicvault
    volumes:
      - ollama_data:/root/.ollama
    # No GPU configured yet - uncomment when one is available, no other
    # changes needed elsewhere (model name stays env-driven in tcg-scraper).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    networks:
      - comicvault
    environment:
      POSTGRES_USER: comicvault
      POSTGRES_PASSWORD: comicvault
      POSTGRES_DB: comicvault
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comicvault"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
  ollama_data:
