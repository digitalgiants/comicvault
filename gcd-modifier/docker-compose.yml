# Standalone compose file for local iteration against a throwaway Postgres.
# In the full ComicVault stack, gcd-modifier is wired into the root
# docker-compose.yml instead, against the shared postgres server.
services:
  gcd-modifier:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - GCD_USERNAME=${GCD_USERNAME}
      - GCD_PASSWORD=${GCD_PASSWORD}
      - POSTGRES_USER=gcd
      - POSTGRES_PASSWORD=gcd
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=gcd
    volumes:
      - dump_data:/data/dumps
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gcd
      POSTGRES_PASSWORD: gcd
      POSTGRES_DB: gcd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcd"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  dump_data:
