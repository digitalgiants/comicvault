[project]
name = "gcd-modifier"
version = "0.1.0"
description = "Fetches the Grand Comics Database SQLite dump, filters it to English-language comics, and loads a curated subset into ComicVault's shared Postgres server"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
    "playwright>=1.48",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
]

[project.scripts]
gcd-modifier = "gcd_modifier.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcd_modifier"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
