[project]
name = "comic-scraper"
version = "0.1.0"
description = "UPC/EAN-5 comic issue lookup against the Metron API"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
]

[project.scripts]
comic-scraper = "comic_scraper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comic_scraper"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
]
