services:
  app:
    build: .
    env_file: .env
    environment:
      POSTGRES_USER: comic_scraper
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_DB: comic_scraper
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9095:9095"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: comic_scraper
      POSTGRES_USER: comic_scraper
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comic_scraper"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
