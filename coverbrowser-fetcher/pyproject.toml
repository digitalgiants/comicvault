[project]
name = "coverbrowser-fetcher"
version = "0.1.0"
description = "Matches GCD's pre-2011 series against coverbrowser.com and (eventually) pulls cover images for the ones matched with confidence"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
]

[project.scripts]
coverbrowser-fetcher = "coverbrowser_fetcher.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coverbrowser_fetcher"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
